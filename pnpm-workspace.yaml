packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  sharp: true
  unrs-resolver: true
  esbuild: true
  '@prisma/engines': true
  prisma: true
  argon2: true
  '@swc/core': true
  msgpackr-extract: true
  # dockerode transitive deps: SSH transport and native helpers are unused (unix socket only).
  cpu-features: false
  protobufjs: false
  ssh2: false

# Advisories reviewed as not exploitable here; drop each entry once Prisma ships the fix.
auditConfig:
  ignoreGhsas:
    # mysql2 (<3.22.0) via the prisma CLI: HubMine only talks to PostgreSQL.
    - GHSA-3f6p-5ww8-9rcr
    # deepmerge-ts (<8.0.0) via @prisma/config: only merges our static prisma.config.ts.
    - GHSA-ggr8-5vv4-36mx
